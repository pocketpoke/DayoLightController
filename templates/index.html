<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayo Light Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .header .subtitle {
            font-size: 0.9rem;
            color: #888;
        }

        .status-card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #2a2a2a;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-label {
            font-size: 0.9rem;
            color: #aaa;
        }

        .status-value {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-value.live {
            color: #ef4444;
        }

        .status-value.offline {
            color: #22c55e;
        }

        .status-value.on {
            color: #eab308;
        }

        .status-value.off {
            color: #6b7280;
        }

        .indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .indicator.live {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .indicator.offline {
            background: #22c55e;
            animation: none;
        }

        .indicator.on {
            background: #eab308;
            box-shadow: 0 0 8px #eab308;
        }

        .indicator.off {
            background: #6b7280;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .mode-card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #2a2a2a;
        }

        .mode-card h2 {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #fff;
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        .mode-btn {
            padding: 1rem 1.5rem;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            background: #222;
            color: #e0e0e0;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .mode-btn:hover {
            border-color: #444;
            background: #2a2a2a;
        }

        .mode-btn.active {
            border-color: #3b82f6;
            background: #1e3a5f;
            color: #fff;
        }

        .mode-btn.manual-on {
            border-color: #2a2a2a;
        }

        .mode-btn.manual-on.active {
            border-color: #eab308;
            background: #422006;
        }

        .mode-btn.manual-off {
            border-color: #2a2a2a;
        }

        .mode-btn.manual-off.active {
            border-color: #6b7280;
            background: #1f2937;
        }

        .mode-icon {
            font-size: 1.2rem;
        }

        .mode-info {
            flex: 1;
        }

        .mode-name {
            display: block;
        }

        .mode-desc {
            display: block;
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
            font-weight: 400;
        }

        .status-msg {
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            margin-top: 1rem;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dayo Light</h1>
            <div class="subtitle">Twitch Stream Light Controller</div>
        </div>

        <div class="status-card">
            <div class="status-row">
                <span class="status-label">Twitch Status</span>
                <span class="status-value" id="twitch-status">
                    <span class="indicator" id="twitch-indicator"></span>
                    <span id="twitch-text">Loading...</span>
                </span>
            </div>
            <div class="status-row">
                <span class="status-label">Light Status</span>
                <span class="status-value" id="light-status">
                    <span class="indicator" id="light-indicator"></span>
                    <span id="light-text">Loading...</span>
                </span>
            </div>
            <div class="status-row">
                <span class="status-label">Mode</span>
                <span class="status-value" id="mode-display">Loading...</span>
            </div>
        </div>

        <div class="mode-card">
            <h2>Control</h2>
            <div class="mode-buttons">
                <button class="mode-btn active" id="btn-auto" onclick="setMode('auto')">
                    <span class="mode-icon">&#9881;</span>
                    <span class="mode-info">
                        <span class="mode-name">Auto Mode</span>
                        <span class="mode-desc">Follow Twitch stream status</span>
                    </span>
                </button>
                <button class="mode-btn manual-on" id="btn-manual-on" onclick="setMode('manual-on')">
                    <span class="mode-icon">&#9728;</span>
                    <span class="mode-info">
                        <span class="mode-name">Manual On</span>
                        <span class="mode-desc">Keep light on regardless of stream</span>
                    </span>
                </button>
                <button class="mode-btn manual-off" id="btn-manual-off" onclick="setMode('manual-off')">
                    <span class="mode-icon">&#9790;</span>
                    <span class="mode-info">
                        <span class="mode-name">Manual Off</span>
                        <span class="mode-desc">Keep light off regardless of stream</span>
                    </span>
                </button>
            </div>
        </div>

        <div class="status-msg" id="status-msg"></div>
        <div class="footer">Dayo Light Controller</div>
    </div>

    <script>
        function updateUI(data) {
            // Twitch status
            const twitchIndicator = document.getElementById('twitch-indicator');
            const twitchText = document.getElementById('twitch-text');
            const twitchStatus = document.getElementById('twitch-status');

            if (data.twitch_live) {
                twitchIndicator.className = 'indicator live';
                twitchText.textContent = 'LIVE';
                twitchStatus.className = 'status-value live';
            } else {
                twitchIndicator.className = 'indicator offline';
                twitchText.textContent = 'Offline';
                twitchStatus.className = 'status-value offline';
            }

            // Light status
            const lightIndicator = document.getElementById('light-indicator');
            const lightText = document.getElementById('light-text');
            const lightStatus = document.getElementById('light-status');

            if (data.outlet_on) {
                lightIndicator.className = 'indicator on';
                lightText.textContent = 'On';
                lightStatus.className = 'status-value on';
            } else {
                lightIndicator.className = 'indicator off';
                lightText.textContent = 'Off';
                lightStatus.className = 'status-value off';
            }

            // Mode display
            const modeDisplay = document.getElementById('mode-display');
            const modeNames = {
                'auto': 'Auto',
                'manual-on': 'Manual On',
                'manual-off': 'Manual Off'
            };
            modeDisplay.textContent = modeNames[data.mode] || data.mode;

            // Mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if (data.mode === 'auto') {
                document.getElementById('btn-auto').classList.add('active');
            } else if (data.mode === 'manual-on') {
                document.getElementById('btn-manual-on').classList.add('active');
            } else if (data.mode === 'manual-off') {
                document.getElementById('btn-manual-off').classList.add('active');
            }

            // Status message
            document.getElementById('status-msg').textContent = data.status_message;
        }

        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                updateUI(data);
            } catch (err) {
                console.error('Failed to fetch status:', err);
            }
        }

        async function setMode(mode) {
            try {
                const response = await fetch('/api/mode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: mode })
                });
                const data = await response.json();
                updateUI(data);
            } catch (err) {
                console.error('Failed to set mode:', err);
            }
        }

        // Initial fetch
        fetchStatus();

        // Poll every 5 seconds
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
